<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION2 聖域副本戰術排班系統 (多組別團隊管理版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* 客製化三角形樣式 */
        .clip-triangle {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
        /* 彈窗漸變動畫 */
        .modal-animate {
            animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6 selection:bg-red-600 selection:text-white">

    <!-- 頂部標題與模式切換頁籤 -->
    <header class="w-full max-w-5xl mx-auto text-center py-2 mb-2">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-950/80 border border-red-800 text-red-400 text-xs font-semibold uppercase tracking-wider mb-2">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            AION2 副本戰術工具 (多隊組別支援版)
        </div>
        <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-red-400 via-rose-300 to-amber-300 bg-clip-text text-transparent">
            聖域：穆斯費爾戰術排班系統
        </h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1 mb-4">
            支援「聖杯 10 人披薩站位」與「8 人放射線/藍三角機制」多團隊自由切換與排班！
        </p>

        <!-- 頁籤切換按鈕 -->
        <div class="flex justify-center gap-3">
            <button id="tab-btn-grail" onclick="switchTab('grail')" class="px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-red-600 text-white border border-red-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                聖杯 10 人披薩排班
            </button>
            <button id="tab-btn-radiant" onclick="switchTab('radiant')" class="px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">
                <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                8 人放射線藍三角機制排班
            </button>
        </div>
    </header>

    <!-- 模式 1：聖杯 10 人披薩排班 -->
    <main id="view-grail" class="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-grow">
        <section class="lg:col-span-5 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl backdrop-blur-md">
            
            <!-- 團隊/組別切換控制列 -->
            <div class="mb-4 p-3 bg-slate-950/80 rounded-xl border border-slate-800/80 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <label for="grail-team-select" class="text-xs font-bold text-red-400 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        目前團隊組別：
                    </label>
                    <span id="save-status-grail" class="text-xs text-emerald-400 font-medium opacity-0 transition-opacity duration-300">已自動儲存</span>
                </div>
                <div class="flex gap-1.5">
                    <select id="grail-team-select" onchange="onGrailTeamChange(this.value)" class="flex-grow bg-slate-900 border border-slate-700 text-slate-100 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-red-500 font-semibold">
                        <!-- 動態插入團隊選單 -->
                    </select>
                    <button onclick="addGrailTeamPrompt()" title="新增團隊" class="p-1.5 bg-red-950/80 hover:bg-red-900 border border-red-800 text-red-300 rounded-lg transition active:scale-95 text-xs flex items-center gap-1 font-bold">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        新增
                    </button>
                    <button onclick="renameGrailTeamPrompt()" title="重命名目前組別" class="p-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg transition active:scale-95 text-xs">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    </button>
                    <button onclick="deleteGrailTeamConfirm()" title="刪除目前組別" class="p-1.5 bg-slate-800 hover:bg-rose-950/80 hover:border-rose-800 text-rose-400 rounded-lg transition active:scale-95 text-xs">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between mb-2 pb-2 border-b border-slate-800">
                <h2 class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    成員名單編排
                </h2>
            </div>
            <div id="inputs-container-grail" class="space-y-2 max-h-[340px] overflow-y-auto pr-1"></div>
            <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-800">
                <button onclick="randomizeGrail()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5 shadow-sm">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    隨機分組
                </button>
                <button onclick="clearGrail()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5 shadow-sm">
                    <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    清空成員
                </button>
                <button onclick="copyGrail()" class="px-3 py-2 bg-red-600 hover:bg-red-500 active:scale-95 text-white text-xs font-semibold rounded-xl transition flex items-center justify-center gap-1.5 shadow-lg shadow-red-900/30">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    複製清單
                </button>
            </div>
        </section>

        <section class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md relative overflow-hidden min-h-[460px]">
            <div class="absolute inset-0 bg-radial from-red-950/30 via-transparent to-transparent pointer-events-none"></div>
            <div class="relative w-[360px] h-[360px] md:w-[400px] md:h-[400px] rounded-full flex items-center justify-center shadow-2xl border-4 border-red-950/80 bg-slate-950">
                <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 400 400">
                    <defs>
                        <radialGradient id="pizzaGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#7f1d1d" />
                            <stop offset="100%" stop-color="#450a0a" />
                        </radialGradient>
                    </defs>
                    <circle cx="200" cy="200" r="190" fill="url(#pizzaGlow)" stroke="#991b1b" stroke-width="3" />
                    <line x1="200" y1="200" x2="200" y2="10" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="200" y2="390" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="10" y2="200" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="390" y2="200" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="334" y2="66" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="66" y2="334" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="66" y2="66" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="334" y2="334" stroke="#5c1313" stroke-width="2" />
                </svg>
                <div class="absolute w-24 h-24 rounded-full bg-gradient-to-br from-red-700 to-red-950 border-2 border-red-600/60 shadow-xl flex flex-col items-center justify-center z-10 pointer-events-none">
                    <span class="text-xs font-bold text-red-200 tracking-wider">BOSS</span>
                    <span class="text-[10px] text-red-400 font-medium">聖杯核心</span>
                </div>
                <div id="pizza-slots-container" class="absolute inset-0 pointer-events-none"></div>
            </div>
            <div class="mt-3 flex items-center justify-center gap-6 text-xs text-slate-400">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span> ★ 星星位：左側水平位</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-sky-400 inline-block"></span> 🌙 月亮位：右側水平位</span>
            </div>
        </section>
    </main>

    <!-- 模式 2：8人放射線藍三角機制排班 -->
    <main id="view-radiant" class="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-grow hidden">
        <section class="lg:col-span-5 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl backdrop-blur-md">
            
            <!-- 團隊/組別切換控制列 -->
            <div class="mb-4 p-3 bg-slate-950/80 rounded-xl border border-slate-800/80 flex flex-col gap-2">
                <div class="flex items-center justify-between">
                    <label for="radiant-team-select" class="text-xs font-bold text-sky-400 flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        目前團隊組別：
                    </label>
                    <span id="save-status-radiant" class="text-xs text-emerald-400 font-medium opacity-0 transition-opacity duration-300">已自動儲存</span>
                </div>
                <div class="flex gap-1.5">
                    <select id="radiant-team-select" onchange="onRadiantTeamChange(this.value)" class="flex-grow bg-slate-900 border border-slate-700 text-slate-100 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none focus:border-sky-500 font-semibold">
                        <!-- 動態插入團隊選單 -->
                    </select>
                    <button onclick="addRadiantTeamPrompt()" title="新增團隊" class="p-1.5 bg-sky-950/80 hover:bg-sky-900 border border-sky-800 text-sky-300 rounded-lg transition active:scale-95 text-xs flex items-center gap-1 font-bold">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        新增
                    </button>
                    <button onclick="renameRadiantTeamPrompt()" title="重命名目前組別" class="p-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-lg transition active:scale-95 text-xs">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    </button>
                    <button onclick="deleteRadiantTeamConfirm()" title="刪除目前組別" class="p-1.5 bg-slate-800 hover:bg-rose-950/80 hover:border-rose-800 text-rose-400 rounded-lg transition active:scale-95 text-xs">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between mb-2 pb-2 border-b border-slate-800">
                <h2 class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                    成員名單編排
                </h2>
            </div>
            <div id="inputs-container-radiant" class="space-y-2 max-h-[340px] overflow-y-auto pr-1"></div>
            <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-800">
                <button onclick="randomizeRadiant()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5 shadow-sm">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    隨機分組
                </button>
                <button onclick="clearRadiant()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5 shadow-sm">
                    <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    清空成員
                </button>
                <button onclick="copyRadiant()" class="px-3 py-2 bg-sky-600 hover:bg-sky-500 active:scale-95 text-white text-xs font-semibold rounded-xl transition flex items-center justify-center gap-1.5 shadow-lg shadow-sky-900/30">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    複製清單
                </button>
            </div>
        </section>

        <section class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md relative overflow-hidden min-h-[460px]">
            <div class="absolute inset-0 bg-radial from-sky-950/25 via-transparent to-transparent pointer-events-none"></div>
            <div class="relative w-[360px] h-[360px] md:w-[400px] md:h-[400px] rounded-full flex items-center justify-center shadow-2xl border-4 border-slate-800 bg-slate-950">
                
                <!-- SVG 放射線與藍三角圖騰 -->
                <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 400 400">
                    <!-- 8 條放射線 -->
                    <line x1="200" y1="200" x2="200" y2="15" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="200" y2="385" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="15" y2="200" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="385" y2="200" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="331" y2="69" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="69" y2="331" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="69" y2="69" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="331" y2="331" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />

                    <!-- 下方弧形安全區 (坦位裝飾弧度) -->
                    <path d="M 120,335 A 100,100 0 0,0 280,335" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" opacity="0.75" />
                </svg>

                <!-- 中央 BOSS 圓心 -->
                <div class="absolute w-24 h-24 rounded-full bg-gradient-to-br from-red-600 to-red-950 border-2 border-red-500 shadow-xl flex flex-col items-center justify-center z-10 pointer-events-none">
                    <span class="text-xs font-bold text-red-100 tracking-wider">BOSS</span>
                    <span class="text-[9px] text-red-300 font-medium">核心區</span>
                </div>

                <!-- 下方弧形坦位標籤卡片 -->
                <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 bg-red-950/90 border border-red-600/80 px-3 py-1 rounded-xl shadow-xl text-center z-20 pointer-events-auto min-w-[90px]">
                    <div class="text-[9px] font-bold text-red-300">🛡️ 安全弧區</div>
                    <div id="arc-label-display" class="text-xs font-bold text-slate-100 truncate max-w-[100px]">坦位</div>
                </div>

                <!-- 放射線數字編號 (1-8) 與藍三角標記容器 -->
                <div id="radiant-slots-container" class="absolute inset-0 pointer-events-none"></div>

            </div>
            <div class="mt-3 text-xs text-slate-400 text-center">
                包含 1~8 放射線外圈編號、8個藍三角裝飾位以及下方紅色弧形安全坦位！

    <!-- 通用自訂彈窗 Dialog (替代 native alert/confirm) -->
    <div id="custom-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-5 max-w-sm w-full shadow-2xl modal-animate flex flex-col gap-4">
            <div id="modal-header" class="text-base font-bold text-slate-100">提示</div>
            <div id="modal-body" class="text-xs text-slate-300">內容訊息</div>
            <div id="modal-input-wrapper" class="hidden">
                <input type="text" id="modal-input" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-red-500" placeholder="請輸入...">
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
                <button id="modal-cancel-btn" onclick="closeModal()" class="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition">取消</button>
                <button id="modal-confirm-btn" class="px-3.5 py-1.5 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-lg transition">確定</button>
            </div>
        </div>
    </div>

    <!-- 通用 Toast 浮動通知 -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl shadow-2xl flex items-center gap-2 text-xs font-semibold z-50 transform translate-y-10 opacity-0 transition-all duration-300 pointer-events-none">
        <span id="toast-icon">✨</span>
        <span id="toast-msg">訊息說明</span>
    </div>

    <footer class="w-full max-w-5xl mx-auto text-center py-4 mt-2 text-xs text-slate-500 border-t border-slate-900">
        AION2 Sanctuary Strategy Tool &copy; 2026. All rights reserved.
    </footer>

    <script>
        // --- 彈窗 & Toast 系統 (代換 alert / confirm) ---
        function showToast(msg, icon = '✨') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.remove('translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 2500);
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function showPromptModal(title, defaultVal, placeholder, onConfirm) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-header').innerText = title;
            document.getElementById('modal-body').innerText = '請輸入新區塊/組別名稱：';
            const inputWrapper = document.getElementById('modal-input-wrapper');
            const input = document.getElementById('modal-input');
            inputWrapper.classList.remove('hidden');
            input.value = defaultVal || '';
            input.placeholder = placeholder || '';
            
            const cancelBtn = document.getElementById('modal-cancel-btn');
            cancelBtn.classList.remove('hidden');

            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.onclick = () => {
                const val = input.value.trim();
                if (val) {
                    onConfirm(val);
                    closeModal();
                }
            };

            modal.classList.remove('hidden');
            setTimeout(() => input.focus(), 100);
        }

        function showConfirmModal(title, msg, onConfirm) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-header').innerText = title;
            document.getElementById('modal-body').innerText = msg;
            document.getElementById('modal-input-wrapper').classList.add('hidden');
            
            const cancelBtn = document.getElementById('modal-cancel-btn');
            cancelBtn.classList.remove('hidden');

            const confirmBtn = document.getElementById('modal-confirm-btn');
            confirmBtn.onclick = () => {
                onConfirm();
                closeModal();
            };

            modal.classList.remove('hidden');
        }

        // --- 頁籤切換邏輯 ---
        function switchTab(tab) {
            const btnGrail = document.getElementById('tab-btn-grail');
            const btnRadiant = document.getElementById('tab-btn-radiant');
            const viewGrail = document.getElementById('view-grail');
            const viewRadiant = document.getElementById('view-radiant');

            if (tab === 'grail') {
                btnGrail.className = "px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-red-600 text-white border border-red-500";
                btnRadiant.className = "px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700";
                viewGrail.classList.remove('hidden');
                viewRadiant.classList.add('hidden');
            } else {
                btnRadiant.className = "px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-sky-600 text-white border border-sky-500";
                btnGrail.className = "px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700";
                viewRadiant.classList.remove('hidden');
                viewGrail.classList.add('hidden');
            }
        }

        // --- 模式 1：聖杯 10 人邏輯 與 多團隊資料管理 ---
        const slotConfigsGrail = [
            { id: '1', type: 'pizza', label: '1 號位', angle: 22.5,  defaultName: "隊員 1" },
            { id: '2', type: 'pizza', label: '2 號位', angle: 67.5,  defaultName: "隊員 2" },
            { id: '3', type: 'pizza', label: '3 號位', angle: 112.5, defaultName: "隊員 3" },
            { id: '4', type: 'pizza', label: '4 號位', angle: 157.5, defaultName: "隊員 4" },
            { id: '5', type: 'pizza', label: '5 號位', angle: 202.5, defaultName: "隊員 5" },
            { id: '6', type: 'pizza', label: '6 號位', angle: 247.5, defaultName: "隊員 6" },
            { id: '7', type: 'pizza', label: '7 號位', angle: 292.5, defaultName: "隊員 7" },
            { id: '8', type: 'pizza', label: '8 號位', angle: 337.5, defaultName: "隊員 8" },
            { id: 'star', type: 'special', label: '★ 星星位', angle: 270, defaultName: "星星隊員" },
            { id: 'moon', type: 'special', label: '🌙 月亮位', angle: 90,  defaultName: "月亮隊員" }
        ];

        function createDefaultGrailSlots() {
            const slots = {};
            slotConfigsGrail.forEach(s => slots[s.id] = s.defaultName);
            return slots;
        }

        function getStoredGrailData() {
            const saved = localStorage.getItem('aion2_grail_teams_v4');
            if (saved) {
                try { return JSON.parse(saved); } catch(e){}
            }
            return {
                activeId: 'g_team_1',
                teams: [
                    { id: 'g_team_1', name: '聖杯一隊 (主力)', slots: createDefaultGrailSlots() },
                    { id: 'g_team_2', name: '聖杯二隊 (分會)', slots: createDefaultGrailSlots() }
                ]
            };
        }

        let grailData = getStoredGrailData();

        function getCurrentGrailTeam() {
            let team = grailData.teams.find(t => t.id === grailData.activeId);
            if (!team && grailData.teams.length > 0) {
                team = grailData.teams[0];
                grailData.activeId = team.id;
            }
            return team;
        }

        function saveGrailStorage() {
            localStorage.setItem('aion2_grail_teams_v4', JSON.stringify(grailData));
            const ind = document.getElementById('save-status-grail');
            ind.style.opacity = '1';
            setTimeout(() => ind.style.opacity = '0', 1200);
        }

        function renderGrailTeamSelect() {
            const select = document.getElementById('grail-team-select');
            select.innerHTML = '';
            grailData.teams.forEach(team => {
                const opt = document.createElement('option');
                opt.value = team.id;
                opt.textContent = team.name;
                if (team.id === grailData.activeId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function onGrailTeamChange(teamId) {
            grailData.activeId = teamId;
            saveGrailStorage();
            renderGrailInputs();
            renderGrailVisual();
            showToast(`已切換至「${getCurrentGrailTeam().name}」`);
        }

        function addGrailTeamPrompt() {
            showPromptModal('新增聖杯團隊組別', `聖杯 ${grailData.teams.length + 1} 隊`, '輸入組別名稱...', (name) => {
                const newId = 'g_team_' + Date.now();
                grailData.teams.push({
                    id: newId,
                    name: name,
                    slots: createDefaultGrailSlots()
                });
                grailData.activeId = newId;
                saveGrailStorage();
                renderGrailTeamSelect();
                renderGrailInputs();
                renderGrailVisual();
                showToast(`已建立新團隊「${name}」`);
            });
        }

        function renameGrailTeamPrompt() {
            const team = getCurrentGrailTeam();
            if (!team) return;
            showPromptModal('重命名團隊組別', team.name, '輸入新組別名稱...', (newName) => {
                team.name = newName;
                saveGrailStorage();
                renderGrailTeamSelect();
                showToast(`已成功更名為「${newName}」`);
            });
        }

        function deleteGrailTeamConfirm() {
            if (grailData.teams.length <= 1) {
                showToast('至少需要保留一個團隊組別！', '⚠️');
                return;
            }
            const team = getCurrentGrailTeam();
            showConfirmModal('刪除團隊組別', `確定要刪除「${team.name}」嗎？此動作無法復原。`, () => {
                grailData.teams = grailData.teams.filter(t => t.id !== team.id);
                grailData.activeId = grailData.teams[0].id;
                saveGrailStorage();
                renderGrailTeamSelect();
                renderGrailInputs();
                renderGrailVisual();
                showToast(`已刪除「${team.name}」`);
            });
        }

        function renderGrailInputs() {
            const container = document.getElementById('inputs-container-grail');
            container.innerHTML = '';
            const currentTeam = getCurrentGrailTeam();
            if (!currentTeam) return;

            slotConfigsGrail.forEach(cfg => {
                const name = currentTeam.slots[cfg.id] || '';
                const isSpecial = cfg.type === 'special';
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-2 rounded-xl border transition ${isSpecial ? 'bg-slate-900/90 border-slate-700/80' : 'bg-slate-950/60 border-slate-800/80'}`;
                
                let badge = `<div class="w-7 h-7 rounded-lg bg-red-950/80 border border-red-800 flex items-center justify-center text-red-300 font-bold text-xs shrink-0">${cfg.id}</div>`;
                if (cfg.id === 'star') badge = `<div class="w-7 h-7 rounded-lg bg-amber-950/90 border border-amber-600 flex items-center justify-center text-amber-300 font-bold text-sm shrink-0">★</div>`;
                if (cfg.id === 'moon') badge = `<div class="w-7 h-7 rounded-lg bg-sky-950/90 border border-sky-600 flex items-center justify-center text-sky-300 font-bold text-sm shrink-0">🌙</div>`;

                div.innerHTML = `
                    ${badge}
                    <div class="flex-grow">
                        <div class="text-[10px] text-slate-400 mb-0.5 font-medium">${cfg.label}</div>
                        <input type="text" value="${name}" data-id="${cfg.id}" placeholder="輸入 ${cfg.label}..." 
                               class="grail-input w-full bg-slate-900 border border-slate-700/60 rounded-lg px-2.5 py-1 text-xs md:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500">
                    </div>
                `;
                container.appendChild(div);
            });

            document.querySelectorAll('.grail-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const slotId = e.target.getAttribute('data-id');
                    getCurrentGrailTeam().slots[slotId] = e.target.value;
                    saveGrailStorage();
                    renderGrailVisual();
                });
            });
        }

        function renderGrailVisual() {
            const container = document.getElementById('pizza-slots-container');
            container.innerHTML = '';
            const currentTeam = getCurrentGrailTeam();
            if (!currentTeam) return;

            slotConfigsGrail.forEach(cfg => {
                const name = currentTeam.slots[cfg.id] || '';
                let radius = 122;
                if (cfg.type === 'special') radius = 84;
                const rad = (cfg.angle - 90) * (Math.PI / 180);
                const x = 200 + radius * Math.cos(rad);
                const y = 200 + radius * Math.sin(rad);

                const badge = document.createElement('div');
                badge.className = "absolute pointer-events-auto transform -translate-x-1/2 -translate-y-1/2 transition-all duration-200 z-20";
                badge.style.left = `${(x/400)*100}%`;
                badge.style.top = `${(y/400)*100}%`;

                let inner = '';
                if (cfg.type === 'pizza') {
                    inner = `<div class="px-2 py-1 bg-slate-900/95 border border-red-500/40 rounded-lg shadow-lg text-center min-w-[50px]">
                        <div class="text-[9px] font-bold text-red-400">#${cfg.id}</div>
                        <div class="text-[11px] font-semibold text-slate-100 truncate max-w-[70px]">${name || '未填'}</div>
                    </div>`;
                } else if (cfg.id === 'star') {
                    inner = `<div class="px-2 py-1 bg-amber-950/95 border border-amber-500/80 rounded-lg shadow-xl text-center min-w-[65px]">
                        <div class="text-[10px] font-bold text-amber-300">★ 星星</div>
                        <div class="text-[11px] font-bold text-amber-100 truncate max-w-[85px]">${name || '未填'}</div>
                    </div>`;
                } else {
                    inner = `<div class="px-2 py-1 bg-sky-950/95 border border-sky-500/80 rounded-lg shadow-xl text-center min-w-[65px]">
                        <div class="text-[10px] font-bold text-sky-300">🌙 月亮</div>
                        <div class="text-[11px] font-bold text-sky-100 truncate max-w-[85px]">${name || '未填'}</div>
                    </div>`;
                }
                badge.innerHTML = inner;
                container.appendChild(badge);
            });
        }

        function randomizeGrail() {
            const team = getCurrentGrailTeam();
            if (!team) return;
            let list = slotConfigsGrail.map(s => team.slots[s.id] && team.slots[s.id].trim() !== '' ? team.slots[s.id].trim() : s.defaultName);
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            slotConfigsGrail.forEach((s, idx) => team.slots[s.id] = list[idx]);
            saveGrailStorage();
            renderGrailInputs();
            renderGrailVisual();
            showToast('已完成隨機分組！', '🎲');
        }

        function clearGrail() {
            showConfirmModal('清空成員', '確定要清空聖杯 10 人排班名單嗎？', () => {
                const team = getCurrentGrailTeam();
                if (team) {
                    slotConfigsGrail.forEach(s => team.slots[s.id] = '');
                    saveGrailStorage();
                    renderGrailInputs();
                    renderGrailVisual();
                    showToast('已清空成員名單', '🧹');
                }
            });
        }

        function copyGrail() {
            const team = getCurrentGrailTeam();
            if (!team) return;
            let text = `【 AION2 聖域聖杯 - ${team.name} 10人站位排班表 】\n`;
            slotConfigsGrail.forEach(s => text += `${s.label}：${team.slots[s.id] || '(空白)'}\n`);
            
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('已成功複製聖杯排班清單至剪貼簿！', '📋');
        }


        // --- 模式 2：8人放射線藍三角機制邏輯 與 多團隊資料管理 ---
        const slotConfigsRadiant = [
            { id: 'r1', label: '1 號放射線', defaultName: "1號隊員", angle: 0, type: 'rad' },
            { id: 'r2', label: '2 號放射線', defaultName: "2號隊員", angle: 45, type: 'rad' },
            { id: 'r3', label: '3 號放射線', defaultName: "3號隊員", angle: 90, type: 'rad' },
            { id: 'r4', label: '4 號放射線', defaultName: "4號隊員", angle: 135, type: 'rad' },
            { id: 'r5', label: '5 號放射線', defaultName: "5號隊員", angle: 180, type: 'rad' },
            { id: 'r6', label: '6 號放射線', defaultName: "6號隊員", angle: 225, type: 'rad' },
            { id: 'r7', label: '7 號放射線', defaultName: "7號隊員", angle: 270, type: 'rad' },
            { id: 'r8', label: '8 號放射線', defaultName: "8號隊員", angle: 315, type: 'rad' },
            { id: 'tank', label: '下方弧形區 (坦位)', defaultName: "坦位/主坦", type: 'tank' }
        ];

        function createDefaultRadiantSlots() {
            const slots = {};
            slotConfigsRadiant.forEach(s => slots[s.id] = s.defaultName);
            return slots;
        }

        function getStoredRadiantData() {
            const saved = localStorage.getItem('aion2_radiant_teams_v2');
            if (saved) {
                try { return JSON.parse(saved); } catch(e){}
            }
            return {
                activeId: 'r_team_1',
                teams: [
                    { id: 'r_team_1', name: '放射一隊 (主力)', slots: createDefaultRadiantSlots() },
                    { id: 'r_team_2', name: '放射二隊 (分會)', slots: createDefaultRadiantSlots() }
                ]
            };
        }

        let radiantData = getStoredRadiantData();

        function getCurrentRadiantTeam() {
            let team = radiantData.teams.find(t => t.id === radiantData.activeId);
            if (!team && radiantData.teams.length > 0) {
                team = radiantData.teams[0];
                radiantData.activeId = team.id;
            }
            return team;
        }

        function saveRadiantStorage() {
            localStorage.setItem('aion2_radiant_teams_v2', JSON.stringify(radiantData));
            const ind = document.getElementById('save-status-radiant');
            ind.style.opacity = '1';
            setTimeout(() => ind.style.opacity = '0', 1200);
        }

        function renderRadiantTeamSelect() {
            const select = document.getElementById('radiant-team-select');
            select.innerHTML = '';
            radiantData.teams.forEach(team => {
                const opt = document.createElement('option');
                opt.value = team.id;
                opt.textContent = team.name;
                if (team.id === radiantData.activeId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function onRadiantTeamChange(teamId) {
            radiantData.activeId = teamId;
            saveRadiantStorage();
            renderRadiantInputs();
            renderRadiantVisual();
            showToast(`已切換至「${getCurrentRadiantTeam().name}」`);
        }

        function addRadiantTeamPrompt() {
            showPromptModal('新增放射線團隊組別', `放射 ${radiantData.teams.length + 1} 隊`, '輸入組別名稱...', (name) => {
                const newId = 'r_team_' + Date.now();
                radiantData.teams.push({
                    id: newId,
                    name: name,
                    slots: createDefaultRadiantSlots()
                });
                radiantData.activeId = newId;
                saveRadiantStorage();
                renderRadiantTeamSelect();
                renderRadiantInputs();
                renderRadiantVisual();
                showToast(`已建立新團隊「${name}」`);
            });
        }

        function renameRadiantTeamPrompt() {
            const team = getCurrentRadiantTeam();
            if (!team) return;
            showPromptModal('重命名團隊組別', team.name, '輸入新組別名稱...', (newName) => {
                team.name = newName;
                saveRadiantStorage();
                renderRadiantTeamSelect();
                showToast(`已成功更名為「${newName}」`);
            });
        }

        function deleteRadiantTeamConfirm() {
            if (radiantData.teams.length <= 1) {
                showToast('至少需要保留一個團隊組別！', '⚠️');
                return;
            }
            const team = getCurrentRadiantTeam();
            showConfirmModal('刪除團隊組別', `確定要刪除「${team.name}」嗎？此動作無法復原。`, () => {
                radiantData.teams = radiantData.teams.filter(t => t.id !== team.id);
                radiantData.activeId = radiantData.teams[0].id;
                saveRadiantStorage();
                renderRadiantTeamSelect();
                renderRadiantInputs();
                renderRadiantVisual();
                showToast(`已刪除「${team.name}」`);
            });
        }

        function renderRadiantInputs() {
            const container = document.getElementById('inputs-container-radiant');
            container.innerHTML = '';
            const currentTeam = getCurrentRadiantTeam();
            if (!currentTeam) return;

            slotConfigsRadiant.forEach(cfg => {
                const name = currentTeam.slots[cfg.id] || '';
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-2 rounded-xl border transition ${cfg.type === 'tank' ? 'bg-red-950/40 border-red-800/80' : 'bg-slate-950/60 border-slate-800/80'}`;
                
                let badge = `<div class="w-7 h-7 rounded-lg bg-sky-950/80 border border-sky-800 flex items-center justify-center text-sky-300 font-bold text-xs shrink-0">${cfg.id.replace('r','')}</div>`;
                if (cfg.type === 'tank') {
                    badge = `<div class="w-7 h-7 rounded-lg bg-red-900 border border-red-600 flex items-center justify-center text-white font-bold text-xs shrink-0">坦</div>`;
                }

                div.innerHTML = `
                    ${badge}
                    <div class="flex-grow">
                        <div class="text-[10px] text-slate-400 mb-0.5 font-medium">${cfg.label}</div>
                        <input type="text" value="${name}" data-id="${cfg.id}" placeholder="輸入 ${cfg.label}..." 
                               class="radiant-input w-full bg-slate-900 border border-slate-700/60 rounded-lg px-2.5 py-1 text-xs md:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500">
                    </div>
                `;
                container.appendChild(div);
            });

            document.querySelectorAll('.radiant-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const slotId = e.target.getAttribute('data-id');
                    getCurrentRadiantTeam().slots[slotId] = e.target.value;
                    saveRadiantStorage();
                    renderRadiantVisual();
                });
            });
        }

        function renderRadiantVisual() {
            const container = document.getElementById('radiant-slots-container');
            container.innerHTML = '';
            const currentTeam = getCurrentRadiantTeam();
            if (!currentTeam) return;

            // 渲染 8 個放射線編號標籤與藍三角
            slotConfigsRadiant.filter(s => s.type === 'rad').forEach(cfg => {
                const name = currentTeam.slots[cfg.id] || '';
                const radius = 135;
                const rad = (cfg.angle - 90) * (Math.PI / 180);
                const x = 200 + radius * Math.cos(rad);
                const y = 200 + radius * Math.sin(rad);

                const badge = document.createElement('div');
                badge.className = "absolute pointer-events-auto transform -translate-x-1/2 -translate-y-1/2 transition-all duration-200 z-20";
                badge.style.left = `${(x/400)*100}%`;
                badge.style.top = `${(y/400)*100}%`;

                badge.innerHTML = `
                    <div class="px-2 py-1 bg-slate-900/95 border border-sky-500/50 rounded-lg shadow-lg text-center min-w-[55px]">
                        <div class="text-[9px] font-bold text-sky-400">#${cfg.id.replace('r','')} 放射</div>
                        <div class="text-[11px] font-semibold text-slate-100 truncate max-w-[75px]">${name || '未填'}</div>
                    </div>
                `;
                container.appendChild(badge);

                // 藍色三角形點
                const triRadius = 75;
                const triX = 200 + triRadius * Math.cos(rad);
                const triY = 200 + triRadius * Math.sin(rad);
                const triBadge = document.createElement('div');
                triBadge.className = "absolute pointer-events-none transform -translate-x-1/2 -translate-y-1/2 z-10";
                triBadge.style.left = `${(triX/400)*100}%`;
                triBadge.style.top = `${(triY/400)*100}%`;
                triBadge.innerHTML = `<div class="w-3 h-3 bg-blue-500 clip-triangle shadow-md opacity-80"></div>`;
                container.appendChild(triBadge);
            });

            // 更新下方弧形坦位顯示卡片
            const tankName = currentTeam.slots['tank'] || '';
            const arcDisplay = document.getElementById('arc-label-display');
            if (arcDisplay) {
                arcDisplay.innerText = tankName || '坦位';
            }
        }

        function randomizeRadiant() {
            const team = getCurrentRadiantTeam();
            if (!team) return;
            let radSlots = slotConfigsRadiant.filter(s => s.type === 'rad');
            let list = radSlots.map(s => team.slots[s.id] && team.slots[s.id].trim() !== '' ? team.slots[s.id].trim() : s.defaultName);
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            radSlots.forEach((s, idx) => team.slots[s.id] = list[idx]);
            saveRadiantStorage();
            renderRadiantInputs();
            renderRadiantVisual();
            showToast('已完成隨機分組！', '🎲');
        }

        function clearRadiant() {
            showConfirmModal('清空成員', '確定要清空 8 人放射線排班名單嗎？', () => {
                const team = getCurrentRadiantTeam();
                if (team) {
                    slotConfigsRadiant.forEach(s => team.slots[s.id] = '');
                    saveRadiantStorage();
                    renderRadiantInputs();
                    renderRadiantVisual();
                    showToast('已清空成員名單', '🧹');
                }
            });
        }

        function copyRadiant() {
            const team = getCurrentRadiantTeam();
            if (!team) return;
            let text = `【 AION2 聖域 - ${team.name} 8人放射線/藍三角機制排班表 】\n`;
            slotConfigsRadiant.forEach(s => text += `${s.label}：${team.slots[s.id] || '(空白)'}\n`);
            
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('已成功複製放射線排班清單至剪貼簿！', '📋');
        }

        // 頁面載入初始化
        window.addEventListener('DOMContentLoaded', () => {
            renderGrailTeamSelect();
            renderGrailInputs();
            renderGrailVisual();

            renderRadiantTeamSelect();
            renderRadiantInputs();
            renderRadiantVisual();
        });
    </script>
</body>
</html>
