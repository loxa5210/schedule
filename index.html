<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AION2 聖域副本戰術排班系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0f19',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        .clip-triangle {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6 selection:bg-red-600 selection:text-white relative">

    <!-- Toast 通知容器 -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 隱藏的 JSON 檔案選擇器 -->
    <input type="file" id="json-file-input" accept=".json" class="hidden" onchange="handleImportJSON(event)">

    <!-- 通用彈窗 Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all scale-95 opacity-0 duration-200" id="modal-card">
            <h3 id="modal-title" class="text-lg font-bold text-slate-100 mb-2">提示</h3>
            <p id="modal-body" class="text-xs md:text-sm text-slate-300 mb-4 leading-relaxed"></p>
            <div id="modal-input-container" class="mb-4 hidden">
                <input type="text" id="modal-input" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-red-500">
            </div>
            <div class="flex justify-end gap-3" id="modal-actions"></div>
        </div>
    </div>

    <!-- 頂部標題與模式切換頁籤 -->
    <header class="w-full max-w-5xl mx-auto text-center py-2 mb-2">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-950/80 border border-red-800 text-red-400 text-xs font-semibold uppercase tracking-wider mb-2">
            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
            AION2 副本戰術工具 (多組別 & 網址分享)
        </div>
        <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-red-400 via-rose-300 to-amber-300 bg-clip-text text-transparent">
            聖域：穆斯費爾戰術排班系統
        </h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1 mb-4">
            支援「聖杯 10 人」與「8 人放射線」多組別管理，可產生連結一鍵分享或匯出/匯入 JSON 備份！
        </p>

        <!-- 頁籤切換按鈕 -->
        <div class="flex justify-center gap-3">
            <button id="tab-btn-grail" onclick="switchTab('grail')" class="px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-red-600 text-white border border-red-500">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                聖杯 10 人披薩排班
            </button>
            <button id="tab-btn-radiant" onclick="switchTab('radiant')" class="px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700">
                <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                8 人放射線藍三角機制排班
            </button>
        </div>
    </header>

    <!-- 模式 1：聖杯 10 人披薩排班 -->
    <main id="view-grail" class="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-grow">
        <section class="lg:col-span-5 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl backdrop-blur-md">
            <!-- 標題與自動儲存提示 -->
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                <h2 class="text-base font-bold text-slate-200 flex items-center gap-2">
                    <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    聖杯 10 人站位排班名單
                </h2>
                <span id="save-status-grail" class="text-xs text-emerald-400 font-medium opacity-0 transition-opacity duration-300">已自動儲存</span>
            </div>

            <!-- 組別切換控制區 -->
            <div class="flex items-center gap-1.5 mb-3">
                <div class="flex-grow">
                    <select id="team-select-grail" onchange="changeTeam('grail', this.value)" class="w-full bg-slate-950 border border-red-900/80 rounded-xl px-2.5 py-1.5 text-xs font-semibold text-red-300 focus:outline-none focus:border-red-500">
                    </select>
                </div>
                <button onclick="promptAddTeam('grail')" title="新增組別" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl border border-slate-700 transition flex items-center gap-1">
                    ➕ 新增
                </button>
                <button onclick="promptRenameTeam('grail')" title="重命名目前組別" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl border border-slate-700 transition">
                    ✏️
                </button>
                <button onclick="promptDeleteTeam('grail')" title="刪除目前組別" class="px-2 py-1.5 bg-slate-800 hover:bg-rose-950 text-rose-300 text-xs rounded-xl border border-slate-700 hover:border-rose-800 transition">
                    🗑️
                </button>
            </div>

            <div id="inputs-container-grail" class="space-y-2 max-h-[360px] overflow-y-auto pr-1"></div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-800">
                <button onclick="randomizeGrail()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    隨機分組
                </button>
                <button onclick="clearGrail()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    清空本組
                </button>
                <button onclick="copyGrailText()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    複製純文字
                </button>
                <button onclick="generateShareLink()" class="px-3 py-2 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-lg shadow-red-900/40">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    🔗 分享連結
                </button>
                <button onclick="exportJSON()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    📤 匯出 JSON
                </button>
                <button onclick="triggerImportJSON()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0l-4 4m4-4v12"></path></svg>
                    📥 匯入 JSON
                </button>
            </div>
        </section>

        <!-- 右側視覺化圓盤 -->
        <section class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md relative overflow-hidden min-h-[460px]">
            <div class="absolute inset-0 bg-radial from-red-950/30 via-transparent to-transparent pointer-events-none"></div>
            <div class="relative w-[360px] h-[360px] md:w-[400px] md:h-[400px] rounded-full flex items-center justify-center shadow-2xl border-4 border-red-950/80 bg-slate-950">
                <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 400 400">
                    <defs>
                        <radialGradient id="pizzaGlow" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#7f1d1d" />
                            <stop offset="100%" stop-color="#450a0a" />
                        </radialGradient>
                    </defs>
                    <circle cx="200" cy="200" r="190" fill="url(#pizzaGlow)" stroke="#991b1b" stroke-width="3" />
                    <line x1="200" y1="200" x2="200" y2="10" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="200" y2="390" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="10" y2="200" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="390" y2="200" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="334" y2="66" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="66" y2="334" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="66" y2="66" stroke="#5c1313" stroke-width="2" />
                    <line x1="200" y1="200" x2="334" y2="334" stroke="#5c1313" stroke-width="2" />
                </svg>
                <div class="absolute w-24 h-24 rounded-full bg-gradient-to-br from-red-700 to-red-950 border-2 border-red-600/60 shadow-xl flex flex-col items-center justify-center z-10 pointer-events-none">
                    <span class="text-xs font-bold text-red-200 tracking-wider">BOSS</span>
                    <span class="text-[10px] text-red-400 font-medium">聖杯核心</span>
                </div>
                <div id="pizza-slots-container" class="absolute inset-0 pointer-events-none"></div>
            </div>
            <div class="mt-3 flex items-center justify-center gap-6 text-xs text-slate-400">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-400 inline-block"></span> ★ 星星位：左側水平位</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-sky-400 inline-block"></span> 🌙 月亮位：右側水平位</span>
            </div>
        </section>
    </main>

    <!-- 模式 2：8人放射線藍三角機制排班 -->
    <main id="view-radiant" class="w-full max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 items-start flex-grow hidden">
        <section class="lg:col-span-5 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 md:p-5 shadow-2xl backdrop-blur-md">
            <!-- 標題與自動儲存提示 -->
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
                <h2 class="text-base font-bold text-slate-200 flex items-center gap-2">
                    <svg class="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                    8人放射線/藍三角機制排班
                </h2>
                <span id="save-status-radiant" class="text-xs text-emerald-400 font-medium opacity-0 transition-opacity duration-300">已自動儲存</span>
            </div>

            <!-- 組別切換控制區 -->
            <div class="flex items-center gap-1.5 mb-3">
                <div class="flex-grow">
                    <select id="team-select-radiant" onchange="changeTeam('radiant', this.value)" class="w-full bg-slate-950 border border-sky-900/80 rounded-xl px-2.5 py-1.5 text-xs font-semibold text-sky-300 focus:outline-none focus:border-sky-500">
                    </select>
                </div>
                <button onclick="promptAddTeam('radiant')" title="新增組別" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl border border-slate-700 transition flex items-center gap-1">
                    ➕ 新增
                </button>
                <button onclick="promptRenameTeam('radiant')" title="重命名目前組別" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl border border-slate-700 transition">
                    ✏️
                </button>
                <button onclick="promptDeleteTeam('radiant')" title="刪除目前組別" class="px-2 py-1.5 bg-slate-800 hover:bg-rose-950 text-rose-300 text-xs rounded-xl border border-slate-700 hover:border-rose-800 transition">
                    🗑️
                </button>
            </div>

            <div id="inputs-container-radiant" class="space-y-2 max-h-[360px] overflow-y-auto pr-1"></div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-800">
                <button onclick="randomizeRadiant()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    隨機分組
                </button>
                <button onclick="clearRadiant()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    清空本組
                </button>
                <button onclick="copyRadiantText()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    複製純文字
                </button>
                <button onclick="generateShareLink()" class="px-3 py-2 bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-500 hover:to-blue-500 text-white text-xs font-bold rounded-xl transition flex items-center justify-center gap-1.5 shadow-lg shadow-sky-900/40">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    🔗 分享連結
                </button>
                <button onclick="exportJSON()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    📤 匯出 JSON
                </button>
                <button onclick="triggerImportJSON()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-xl border border-slate-700 transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0l-4 4m4-4v12"></path></svg>
                    📥 匯入 JSON
                </button>
            </div>
        </section>

        <!-- 右側視覺化圓盤 -->
        <section class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md relative overflow-hidden min-h-[460px]">
            <div class="absolute inset-0 bg-radial from-sky-950/25 via-transparent to-transparent pointer-events-none"></div>
            <div class="relative w-[360px] h-[360px] md:w-[400px] md:h-[400px] rounded-full flex items-center justify-center shadow-2xl border-4 border-slate-800 bg-slate-950">
                <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 400 400">
                    <line x1="200" y1="200" x2="200" y2="15" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="200" y2="385" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="15" y2="200" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="385" y2="200" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="331" y2="69" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="69" y2="331" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="69" y2="69" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                    <line x1="200" y1="200" x2="331" y2="331" stroke="#3b82f6" stroke-width="1.5" opacity="0.6" />
                </svg>

                <div class="absolute w-24 h-24 rounded-full bg-gradient-to-br from-red-600 to-red-950 border-2 border-red-500 shadow-xl flex flex-col items-center justify-center z-10 pointer-events-none">
                    <span class="text-xs font-bold text-red-100 tracking-wider">BOSS</span>
                    <span class="text-[9px] text-red-300 font-medium">核心區</span>
                </div>

                <div id="radiant-slots-container" class="absolute inset-0 pointer-events-none"></div>
            </div>
            <div class="mt-3 text-xs text-slate-400 text-center">
                包含 1~8 放射線外圈編號、8個藍三角裝飾位以及下方弧形坦位！
            </div>
        </section>
    </main>

    <footer class="w-full max-w-5xl mx-auto text-center py-4 mt-2 text-xs text-slate-500 border-t border-slate-900">
        AION2 Sanctuary Strategy Tool &copy; 2026. All rights reserved.
    </footer>

    <script>
        // --- 通用 UI 元件 (Toast 與 Modal) ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-950/90 border-emerald-700 text-emerald-200' : 'bg-rose-950/90 border-rose-700 text-rose-200';
            toast.className = `px-4 py-2.5 rounded-xl border shadow-xl text-xs font-semibold backdrop-blur-md transition-all transform translate-y-2 opacity-0 flex items-center gap-2 ${bgClass}`;
            toast.innerHTML = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-[-8px]');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showCustomModal({ title, body, hasInput = false, inputValue = '', onConfirm, confirmText = '確定', cancelText = '取消' }) {
            const overlay = document.getElementById('modal-overlay');
            const card = document.getElementById('modal-card');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            const inputContainer = document.getElementById('modal-input-container');
            const input = document.getElementById('modal-input');
            const actions = document.getElementById('modal-actions');

            modalTitle.innerText = title;
            modalBody.innerHTML = body;

            if (hasInput) {
                inputContainer.classList.remove('hidden');
                input.value = inputValue;
                setTimeout(() => input.focus(), 100);
            } else {
                inputContainer.classList.add('hidden');
            }

            actions.innerHTML = '';
            if (cancelText) {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700 transition';
                cancelBtn.innerText = cancelText;
                cancelBtn.onclick = closeModal;
                actions.appendChild(cancelBtn);
            }

            const confirmBtn = document.createElement('button');
            confirmBtn.className = 'px-4 py-2 bg-red-600 hover:bg-red-500 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-red-900/30';
            confirmBtn.innerText = confirmText;
            confirmBtn.onclick = () => {
                const val = hasInput ? input.value : true;
                if (onConfirm(val) !== false) {
                    closeModal();
                }
            };
            actions.appendChild(confirmBtn);

            overlay.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modal-overlay');
            const card = document.getElementById('modal-card');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 200);
        }

        // --- 頁籤切換邏輯 ---
        let currentTab = 'grail';
        function switchTab(tab) {
            currentTab = tab;
            const btnGrail = document.getElementById('tab-btn-grail');
            const btnRadiant = document.getElementById('tab-btn-radiant');
            const viewGrail = document.getElementById('view-grail');
            const viewRadiant = document.getElementById('view-radiant');

            if (tab === 'grail') {
                btnGrail.className = "px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-red-600 text-white border border-red-500";
                btnRadiant.className = "px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700";
                viewGrail.classList.remove('hidden');
                viewRadiant.classList.add('hidden');
            } else {
                btnRadiant.className = "px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-sky-600 text-white border border-sky-500";
                btnGrail.className = "px-5 py-2.5 rounded-xl font-bold text-xs md:text-sm transition flex items-center gap-2 shadow-lg bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700";
                viewRadiant.classList.remove('hidden');
                viewGrail.classList.add('hidden');
            }
        }

        // --- 資料設定檔與預設資料 ---
        const slotConfigsGrail = [
            { id: '1', type: 'pizza', label: '1 號位', angle: 22.5,  defaultName: "隊員 1" },
            { id: '2', type: 'pizza', label: '2 號位', angle: 67.5,  defaultName: "隊員 2" },
            { id: '3', type: 'pizza', label: '3 號位', angle: 112.5, defaultName: "隊員 3" },
            { id: '4', type: 'pizza', label: '4 號位', angle: 157.5, defaultName: "隊員 4" },
            { id: '5', type: 'pizza', label: '5 號位', angle: 202.5, defaultName: "隊員 5" },
            { id: '6', type: 'pizza', label: '6 號位', angle: 247.5, defaultName: "隊員 6" },
            { id: '7', type: 'pizza', label: '7 號位', angle: 292.5, defaultName: "隊員 7" },
            { id: '8', type: 'pizza', label: '8 號位', angle: 337.5, defaultName: "隊員 8" },
            { id: 'star', type: 'special', label: '★ 星星位', angle: 270, defaultName: "星星位隊員" },
            { id: 'moon', type: 'special', label: '🌙 月亮位', angle: 90,  defaultName: "月亮位隊員" }
        ];

        const slotConfigsRadiant = [
            { id: 'r1', label: '1 號放射線', defaultName: "1號隊員", angle: 0, type: 'rad' },
            { id: 'r2', label: '2 號放射線', defaultName: "2號隊員", angle: 45, type: 'rad' },
            { id: 'r3', label: '3 號放射線', defaultName: "3號隊員", angle: 90, type: 'rad' },
            { id: 'r4', label: '4 號放射線', defaultName: "4號隊員", angle: 135, type: 'rad' },
            { id: 'r5', label: '5 號放射線', defaultName: "5號隊員", angle: 180, type: 'rad' },
            { id: 'r6', label: '6 號放射線', defaultName: "6號隊員", angle: 225, type: 'rad' },
            { id: 'r7', label: '7 號放射線', defaultName: "7號隊員", angle: 270, type: 'rad' },
            { id: 'r8', label: '8 號放射線', defaultName: "8號隊員", angle: 315, type: 'rad' },
        ];

        // 預設組別結構
        function createDefaultStore(mode) {
            const slots = mode === 'grail' ? slotConfigsGrail : slotConfigsRadiant;
            const initSlots = {};
            slots.forEach(s => initSlots[s.id] = s.defaultName);
            return {
                activeTeamId: 't_1',
                teams: [
                    { id: 't_1', name: '團隊一 (主力隊)', slots: { ...initSlots } },
                    { id: 't_2', name: '團隊二 (二分隊)', slots: { ...initSlots } }
                ]
            };
        }

        // --- LocalStorage 讀取與儲存 ---
        function loadStore(mode) {
            const key = mode === 'grail' ? 'aion2_grail_teams_v2' : 'aion2_radiant_teams_v2';
            const saved = localStorage.getItem(key);
            if (saved) {
                try { return JSON.parse(saved); } catch(e){}
            }
            return createDefaultStore(mode);
        }

        function saveStore(mode) {
            const key = mode === 'grail' ? 'aion2_grail_teams_v2' : 'aion2_radiant_teams_v2';
            const data = mode === 'grail' ? grailStore : radiantStore;
            localStorage.setItem(key, JSON.stringify(data));
            const ind = document.getElementById(`save-status-${mode}`);
            if (ind) {
                ind.style.opacity = '1';
                setTimeout(() => ind.style.opacity = '0', 1000);
            }
        }

        let grailStore = loadStore('grail');
        let radiantStore = loadStore('radiant');

        // 取得當前作用中的團隊物件
        function getActiveTeam(mode) {
            const store = mode === 'grail' ? grailStore : radiantStore;
            let team = store.teams.find(t => t.id === store.activeTeamId);
            if (!team && store.teams.length > 0) {
                team = store.teams[0];
                store.activeTeamId = team.id;
            }
            return team;
        }

        // --- 組別選單與管理邏輯 ---
        function renderTeamOptions(mode) {
            const store = mode === 'grail' ? grailStore : radiantStore;
            const select = document.getElementById(`team-select-${mode}`);
            select.innerHTML = '';
            store.teams.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.id;
                opt.innerText = t.name;
                if (t.id === store.activeTeamId) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function changeTeam(mode, teamId) {
            const store = mode === 'grail' ? grailStore : radiantStore;
            store.activeTeamId = teamId;
            saveStore(mode);
            if (mode === 'grail') {
                renderGrailInputs();
                renderGrailVisual();
            } else {
                renderRadiantInputs();
                renderRadiantVisual();
            }
        }

        function promptAddTeam(mode) {
            showCustomModal({
                title: '新增組別',
                body: '請輸入新組別名稱（例如：晚安打卡隊、二隊）：',
                hasInput: true,
                inputValue: `新團隊 ${Date.now().toString().slice(-3)}`,
                onConfirm: (name) => {
                    if (!name.trim()) return false;
                    const store = mode === 'grail' ? grailStore : radiantStore;
                    const slotsConfig = mode === 'grail' ? slotConfigsGrail : slotConfigsRadiant;
                    const initSlots = {};
                    slotsConfig.forEach(s => initSlots[s.id] = s.defaultName);

                    const newTeam = {
                        id: 't_' + Date.now(),
                        name: name.trim(),
                        slots: initSlots
                    };
                    store.teams.push(newTeam);
                    store.activeTeamId = newTeam.id;
                    saveStore(mode);
                    renderTeamOptions(mode);
                    if (mode === 'grail') { renderGrailInputs(); renderGrailVisual(); }
                    else { renderRadiantInputs(); renderRadiantVisual(); }
                    showToast(`已新增組別：「${newTeam.name}」`);
                }
            });
        }

        function promptRenameTeam(mode) {
            const team = getActiveTeam(mode);
            showCustomModal({
                title: '重命名組別',
                body: '請輸入新的組別名稱：',
                hasInput: true,
                inputValue: team.name,
                onConfirm: (newName) => {
                    if (!newName.trim()) return false;
                    team.name = newName.trim();
                    saveStore(mode);
                    renderTeamOptions(mode);
                    showToast(`已更新名稱為：「${team.name}」`);
                }
            });
        }

        function promptDeleteTeam(mode) {
            const store = mode === 'grail' ? grailStore : radiantStore;
            if (store.teams.length <= 1) {
                showCustomModal({ title: '無法刪除', body: '至少必須保留一個團隊組別！', cancelText: '' });
                return;
            }
            const team = getActiveTeam(mode);
            showCustomModal({
                title: '刪除組別確認',
                body: `確定要刪除「<b>${team.name}</b>」嗎？此操作無法復原。`,
                onConfirm: () => {
                    store.teams = store.teams.filter(t => t.id !== team.id);
                    store.activeTeamId = store.teams[0].id;
                    saveStore(mode);
                    renderTeamOptions(mode);
                    if (mode === 'grail') { renderGrailInputs(); renderGrailVisual(); }
                    else { renderRadiantInputs(); renderRadiantVisual(); }
                    showToast('已成功刪除組別！');
                }
            });
        }

        // --- 模式 1：聖杯 10 人邏輯 ---
        function renderGrailInputs() {
            const container = document.getElementById('inputs-container-grail');
            container.innerHTML = '';
            const team = getActiveTeam('grail');

            slotConfigsGrail.forEach(cfg => {
                const name = team.slots[cfg.id] || '';
                const isSpecial = cfg.type === 'special';
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-2 rounded-xl border transition ${isSpecial ? 'bg-slate-900/90 border-slate-700/80' : 'bg-slate-950/60 border-slate-800/80'}`;

                let badge = `<div class="w-7 h-7 rounded-lg bg-red-950/80 border border-red-800 flex items-center justify-center text-red-300 font-bold text-xs shrink-0">${cfg.id}</div>`;
                if (cfg.id === 'star') badge = `<div class="w-7 h-7 rounded-lg bg-amber-950/90 border border-amber-600 flex items-center justify-center text-amber-300 font-bold text-sm shrink-0">★</div>`;
                if (cfg.id === 'moon') badge = `<div class="w-7 h-7 rounded-lg bg-sky-950/90 border border-sky-600 flex items-center justify-center text-sky-300 font-bold text-sm shrink-0">🌙</div>`;

                div.innerHTML = `
                    ${badge}
                    <div class="flex-grow">
                        <div class="text-[10px] text-slate-400 mb-0.5 font-medium">${cfg.label}</div>
                        <input type="text" value="${name}" data-id="${cfg.id}" placeholder="輸入 ${cfg.label}..." 
                               class="grail-input w-full bg-slate-900 border border-slate-700/60 rounded-lg px-2.5 py-1 text-xs md:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-red-500">
                    </div>
                `;
                container.appendChild(div);
            });

            document.querySelectorAll('.grail-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const id = e.target.getAttribute('data-id');
                    team.slots[id] = e.target.value;
                    saveStore('grail');
                    renderGrailVisual();
                });
            });
        }

        function renderGrailVisual() {
            const container = document.getElementById('pizza-slots-container');
            container.innerHTML = '';
            const team = getActiveTeam('grail');

            slotConfigsGrail.forEach(cfg => {
                const name = team.slots[cfg.id] || '';
                let radius = 122;
                if (cfg.type === 'special') radius = 84;
                const rad = (cfg.angle - 90) * (Math.PI / 180);
                const x = 200 + radius * Math.cos(rad);
                const y = 200 + radius * Math.sin(rad);

                const badge = document.createElement('div');
                badge.className = "absolute pointer-events-auto transform -translate-x-1/2 -translate-y-1/2 transition-all duration-200 z-20";
                badge.style.left = `${(x/400)*100}%`;
                badge.style.top = `${(y/400)*100}%`;

                let inner = '';
                if (cfg.type === 'pizza') {
                    inner = `<div class="px-2 py-1 bg-slate-900/95 border border-red-500/40 rounded-lg shadow-lg text-center min-w-[50px]">
                        <div class="text-[9px] font-bold text-red-400">#${cfg.id}</div>
                        <div class="text-[11px] font-semibold text-slate-100 truncate max-w-[70px]">${name || '未填'}</div>
                    </div>`;
                } else if (cfg.id === 'star') {
                    inner = `<div class="px-2 py-1 bg-amber-950/95 border border-amber-500/80 rounded-lg shadow-xl text-center min-w-[65px]">
                        <div class="text-[10px] font-bold text-amber-300">★ 星星</div>
                        <div class="text-[11px] font-bold text-amber-100 truncate max-w-[85px]">${name || '未填'}</div>
                    </div>`;
                } else {
                    inner = `<div class="px-2 py-1 bg-sky-950/95 border border-sky-500/80 rounded-lg shadow-xl text-center min-w-[65px]">
                        <div class="text-[10px] font-bold text-sky-300">🌙 月亮</div>
                        <div class="text-[11px] font-bold text-sky-100 truncate max-w-[85px]">${name || '未填'}</div>
                    </div>`;
                }
                badge.innerHTML = inner;
                container.appendChild(badge);
            });
        }

        function randomizeGrail() {
            const team = getActiveTeam('grail');
            let list = slotConfigsGrail.map(s => team.slots[s.id] && team.slots[s.id].trim() !== '' ? team.slots[s.id].trim() : s.defaultName);
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            slotConfigsGrail.forEach((s, idx) => team.slots[s.id] = list[idx]);
            saveStore('grail');
            renderGrailInputs();
            renderGrailVisual();
            showToast('已完成隨機亂序分組！');
        }

        function clearGrail() {
            showCustomModal({
                title: '清空本組名單',
                body: '確定要清空目前組別的所有內容嗎？',
                onConfirm: () => {
                    const team = getActiveTeam('grail');
                    slotConfigsGrail.forEach(s => team.slots[s.id] = '');
                    saveStore('grail');
                    renderGrailInputs();
                    renderGrailVisual();
                    showToast('已清空名單');
                }
            });
        }

        function copyGrailText() {
            const team = getActiveTeam('grail');
            let text = `【 AION2 聖域聖杯 - ${team.name} 排班表 】\n`;
            slotConfigsGrail.forEach(s => text += `${s.label}：${team.slots[s.id] || '(空白)'}\n`);
            copyToClipboard(text);
            showToast('已成功複製聖杯純文字排班表！');
        }

        // --- 模式 2：8人放射線藍三角機制邏輯 ---
        function renderRadiantInputs() {
            const container = document.getElementById('inputs-container-radiant');
            container.innerHTML = '';
            const team = getActiveTeam('radiant');

            slotConfigsRadiant.forEach(cfg => {
                const name = team.slots[cfg.id] || '';
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-2 rounded-xl border transition ${cfg.type === 'tank' ? 'bg-red-950/40 border-red-800/80' : 'bg-slate-950/60 border-slate-800/80'}`;

                let badge = `<div class="w-7 h-7 rounded-lg bg-sky-950/80 border border-sky-800 flex items-center justify-center text-sky-300 font-bold text-xs shrink-0">${cfg.id.replace('r','')}</div>`;
                if (cfg.type === 'tank') {
                    badge = `<div class="w-7 h-7 rounded-lg bg-red-900 border border-red-600 flex items-center justify-center text-white font-bold text-xs shrink-0">坦</div>`;
                }

                div.innerHTML = `
                    ${badge}
                    <div class="flex-grow">
                        <div class="text-[10px] text-slate-400 mb-0.5 font-medium">${cfg.label}</div>
                        <input type="text" value="${name}" data-id="${cfg.id}" placeholder="輸入 ${cfg.label}..." 
                               class="radiant-input w-full bg-slate-900 border border-slate-700/60 rounded-lg px-2.5 py-1 text-xs md:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500">
                    </div>
                `;
                container.appendChild(div);
            });

            document.querySelectorAll('.radiant-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const id = e.target.getAttribute('data-id');
                    team.slots[id] = e.target.value;
                    saveStore('radiant');
                    renderRadiantVisual();
                });
            });
        }

        function renderRadiantVisual() {
            const container = document.getElementById('radiant-slots-container');
            container.innerHTML = '';
            const team = getActiveTeam('radiant');

            // 渲染 8 個放射線位置
            slotConfigsRadiant.filter(s => s.type === 'rad').forEach(cfg => {
                const name = team.slots[cfg.id] || '';
                const radius = 135;
                const rad = (cfg.angle - 90) * (Math.PI / 180);
                const x = 200 + radius * Math.cos(rad);
                const y = 200 + radius * Math.sin(rad);

                const badge = document.createElement('div');
                badge.className = "absolute pointer-events-auto transform -translate-x-1/2 -translate-y-1/2 transition-all duration-200 z-20";
                badge.style.left = `${(x/400)*100}%`;
                badge.style.top = `${(y/400)*100}%`;

                badge.innerHTML = `
                    <div class="px-2 py-1 bg-slate-900/95 border border-sky-500/50 rounded-lg shadow-lg text-center min-w-[55px]">
                        <div class="text-[9px] font-bold text-sky-400">#${cfg.id.replace('r','')} 放射</div>
                        <div class="text-[11px] font-semibold text-slate-100 truncate max-w-[75px]">${name || '未填'}</div>
                    </div>
                `;
                container.appendChild(badge);

                // 藍色三角形點位
                const triRadius = 75;
                const triX = 200 + triRadius * Math.cos(rad);
                const triY = 200 + triRadius * Math.sin(rad);
                const triBadge = document.createElement('div');
                triBadge.className = "absolute pointer-events-none transform -translate-x-1/2 -translate-y-1/2 z-10";
                triBadge.style.left = `${(triX/400)*100}%`;
                triBadge.style.top = `${(triY/400)*100}%`;
                triBadge.innerHTML = `<div class="w-3 h-3 bg-blue-500 clip-triangle shadow-md opacity-80"></div>`;
                container.appendChild(triBadge);
            });

            // 下方坦位弧形區
            const tankName = team.slots['tank'] || '';
            const tankBadge = document.createElement('div');
            tankBadge.className = "absolute pointer-events-auto transform -translate-x-1/2 transition-all duration-200 z-20";
            tankBadge.style.left = `50%`;
            tankBadge.style.bottom = `18px`;
            container.appendChild(tankBadge);
        }

        function randomizeRadiant() {
            const team = getActiveTeam('radiant');
            let radSlots = slotConfigsRadiant.filter(s => s.type === 'rad');
            let list = radSlots.map(s => team.slots[s.id] && team.slots[s.id].trim() !== '' ? team.slots[s.id].trim() : s.defaultName);
            for (let i = list.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [list[i], list[j]] = [list[j], list[i]];
            }
            radSlots.forEach((s, idx) => team.slots[s.id] = list[idx]);
            saveStore('radiant');
            renderRadiantInputs();
            renderRadiantVisual();
            showToast('已完成隨機亂序分組！');
        }

        function clearRadiant() {
            showCustomModal({
                title: '清空本組名單',
                body: '確定要清空目前組別的所有內容嗎？',
                onConfirm: () => {
                    const team = getActiveTeam('radiant');
                    slotConfigsRadiant.forEach(s => team.slots[s.id] = '');
                    saveStore('radiant');
                    renderRadiantInputs();
                    renderRadiantVisual();
                    showToast('已清空名單');
                }
            });
        }

        function copyRadiantText() {
            const team = getActiveTeam('radiant');
            let text = `【 AION2 聖域 - ${team.name} 8人放射線排班表 】\n`;
            slotConfigsRadiant.forEach(s => text += `${s.label}：${team.slots[s.id] || '(空白)'}\n`);
            copyToClipboard(text);
            showToast('已成功複製 8 人放射線純文字排班表！');
        }

        function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text);
            } else {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
        }

        // --- 🔗 產生分享連結功能 (URL Encoding / Decoding) ---
        function generateShareLink() {
            try {
                const payload = {
                    v: 2,
                    tab: currentTab,
                    grail: grailStore,
                    radiant: radiantStore
                };
                const jsonString = JSON.stringify(payload);
                // URL-safe Base64 編碼，支援 UTF-8 中文字元
                const encoded = btoa(encodeURIComponent(jsonString))
                    .replace(/\+/g, '-')
                    .replace(/\//g, '_')
                    .replace(/=+$/, '');

                const shareUrl = `${window.location.origin}${window.location.pathname}?data=${encoded}`;
                copyToClipboard(shareUrl);
                showToast('🔗 已成功複製網址！發給隊友即可直接同步開啟排班表。');
            } catch (e) {
                console.error(e);
                showToast('產生分享連結失敗', 'error');
            }
        }

        // 檢查網址是否有隊友分享的資料
        function checkUrlShareData() {
            const urlParams = new URLSearchParams(window.location.search);
            const dataParam = urlParams.get('data');
            if (!dataParam) return;

            try {
                let base64 = dataParam.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) {
                    base64 += '=';
                }
                const jsonString = decodeURIComponent(atob(base64));
                const payload = JSON.parse(jsonString);

                if (payload && payload.v === 2 && payload.grail && payload.radiant) {
                    showCustomModal({
                        title: '📥 檢測到分享的戰術排班資料',
                        body: '您開啟的連結包含了隊友分享的完整排班表，請問是否要<b>載入並覆蓋</b>您目前的本機資料？',
                        confirmText: '載入分享資料',
                        cancelText: '忽略',
                        onConfirm: () => {
                            grailStore = payload.grail;
                            radiantStore = payload.radiant;
                            saveStore('grail');
                            saveStore('radiant');

                            if (payload.tab) switchTab(payload.tab);
                            renderTeamOptions('grail');
                            renderGrailInputs();
                            renderGrailVisual();
                            renderTeamOptions('radiant');
                            renderRadiantInputs();
                            renderRadiantVisual();

                            // 清理網址中的參數，保持網址整潔
                            history.replaceState({}, document.title, window.location.pathname);
                            showToast('已成功載入隊友分享的排班資料！');
                        }
                    });
                }
            } catch (e) {
                console.error("解析分享網址失敗", e);
                showToast('❌ 分享連結格式不正確或已毀損', 'error');
            }
        }

        // --- 📤 匯出 JSON 功能 ---
        function exportJSON() {
            try {
                const payload = {
                    v: 2,
                    tab: currentTab,
                    grail: grailStore,
                    radiant: radiantStore
                };
                const jsonStr = JSON.stringify(payload, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const dateStr = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `AION2_tactics_backup_${dateStr}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('📤 已成功下載戰術排班 JSON 備份檔！');
            } catch (e) {
                console.error(e);
                showToast('❌ 匯出 JSON 失敗', 'error');
            }
        }

        // --- 📥 匯入 JSON 功能 ---
        function triggerImportJSON() {
            const input = document.getElementById('json-file-input');
            if (input) {
                input.value = '';
                input.click();
            }
        }

        function handleImportJSON(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const payload = JSON.parse(e.target.result);
                    if (!payload || !payload.grail || !payload.radiant) {
                        throw new Error('格式不符合規範');
                    }

                    showCustomModal({
                        title: '📥 匯入 JSON 資料確認',
                        body: '確定要載入此 JSON 檔案嗎？這將會<b>覆蓋</b>您目前的排班與組別資料。',
                        confirmText: '確定覆蓋匯入',
                        cancelText: '取消',
                        onConfirm: () => {
                            grailStore = payload.grail;
                            radiantStore = payload.radiant;
                            saveStore('grail');
                            saveStore('radiant');

                            if (payload.tab) switchTab(payload.tab);
                            renderTeamOptions('grail');
                            renderGrailInputs();
                            renderGrailVisual();
                            renderTeamOptions('radiant');
                            renderRadiantInputs();
                            renderRadiantVisual();

                            showToast('🎉 JSON 排班資料匯入成功！');
                        }
                    });
                } catch (err) {
                    console.error(err);
                    showToast('❌ 匯入失敗：JSON 檔案格式無效', 'error');
                }
            };
            reader.readAsText(file);
        }

        // 初始化載入
        window.addEventListener('DOMContentLoaded', () => {
            renderTeamOptions('grail');
            renderGrailInputs();
            renderGrailVisual();

            renderTeamOptions('radiant');
            renderRadiantInputs();
            renderRadiantVisual();

            // 檢查是否有分享連結參數
            checkUrlShareData();
        });
    </script>
</body>
</html>
